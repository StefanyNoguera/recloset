{% extends "market/base.html" %}

{% block title %}Eliminar producto - Recloset{% endblock %}

{% block content %}
  <div class="max-w-xl mx-auto">
    <div class="mb-4">
      <a href="javascript:history.back()" class="text-sm text-gray-600 hover:text-gray-900">← Volver</a>
    </div>

    <div class="bg-white border rounded-2xl p-6">
      <h1 class="text-2xl font-semibold">Eliminar producto</h1>
      <p class="text-gray-600 mt-2">
        ¿Seguro que quieres eliminar <strong>{{ item.title }}</strong>? Esta acción no se puede deshacer.
      </p>

      <form method="post" class="mt-6 flex gap-3">
        {% csrf_token %}
        <button class="rounded-xl bg-red-600 text-white font-medium px-4 py-2 hover:bg-red-700 transition">
          Sí, eliminar
        </button>
        <a href="{% url 'my_store' %}" class="rounded-xl border px-4 py-2 font-medium hover:bg-gray-50 transition">
          Cancelar
        </a>
      </form>
    </div>
  </div>
{% endblock %}
